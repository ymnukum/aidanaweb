 Designed interactive activities for children.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- WORK -->\n<section id=\"work\" style=\"padding: clamp(56px, 8vw, 112px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); box-sizing: border-box; display: flex; flex-direction: column; gap: clamp(28px, 4vw, 48px)\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5C6B\">Selected work<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Unbounded', 'Arial Black', sans-serif; font-weight: 700; font-size: clamp(30px, 4vw, 52px); line-height: 1.05; letter-spacing: -0.03em; text-wrap: balance\">Four projects from my degree.<\u002Fh2>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px\">\n\n<article style=\"flex: 2 1 560px; min-width: 0; box-sizing: border-box; min-height: 340px; padding: clamp(24px, 3vw, 36px); border-radius: 28px; background: #2F2BFF; color: #FFFFFF; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<span style=\"font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 1.5px solid #FFFFFF\">Own startup<\u002Fspan>\n<span style=\"font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 1.5px solid #FFFFFF\">Deck + prototype<\u002Fspan>\n<span style=\"font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 1.5px solid #FFFFFF\">Canva<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Unbounded', 'Arial Black', sans-serif; font-weight: 700; font-size: clamp(28px, 3.4vw, 44px); letter-s
